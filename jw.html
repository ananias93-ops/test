<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>실시간 관측소 현황 – 관리 주체별 (2026-11-03)</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="aquaculture_farms.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:#0a1628;color:#e8f4f8;height:100vh;display:flex;flex-direction:column;overflow:hidden;}
  header{padding:0 18px;background:#0d1e36;border-bottom:2px solid #1e3a5f;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;min-height:48px;}
  .tab-bar-inline{display:flex;}
  .meta{font-size:11px;color:#6b8fa8;text-align:right;white-space:nowrap;}
  .meta b{color:#f4a261;}
  .tab-btn{padding:9px 24px;font-size:13px;font-weight:600;color:#6b8fa8;cursor:pointer;border:none;background:transparent;border-bottom:3px solid transparent;margin-bottom:-2px;transition:color .2s,border-color .2s;white-space:nowrap;}
  .tab-btn:hover{color:#b8d8e8;}
  .tab-btn.active{color:#f4a261;border-bottom-color:#f4a261;}
  .tab-sub{font-size:10px;font-weight:400;color:#6b8fa8;margin-left:5px;white-space:nowrap;}
  .tab-btn.active .tab-sub{color:#7ec8e3;}
  @media (max-width: 600px) {
    header{flex-wrap:wrap;row-gap:4px;padding:6px 12px;}
    .tab-bar-inline{order:1;width:100%;}
    .tab-btn{flex:1;padding:6px 2px;font-size:11px;text-align:center;}
    .tab-sub{display:block;margin-left:0;font-size:8.5px;}
    .meta{order:2;width:100%;text-align:left;font-size:10px;}
  }
  .map-panel{flex:1;position:relative;display:none;height:calc(100vh - 48px);}
  .map-panel.active{display:block;}
  .map-panel > div[id^="map"]{width:100%;height:100%;}
  .custom-popup .leaflet-popup-content-wrapper{background:#0d1e36;border:1px solid #1e3a5f;border-radius:8px;box-shadow:0 4px 20px rgba(0,0,0,.5);color:#e8f4f8;}
  .custom-popup .leaflet-popup-tip{background:#1e3a5f;}
  .popup-inner{padding:4px 2px;min-width:155px;}
  .popup-rank{font-size:11px;color:#f4a261;margin-bottom:2px;}
  .popup-name{font-size:15px;font-weight:700;color:#fff;margin-bottom:5px;}
  .popup-sea{display:inline-block;font-size:11px;background:#1e3a5f;border-radius:4px;padding:2px 7px;margin-bottom:7px;color:#7ec8e3;}
  .popup-temp{font-size:26px;font-weight:800;line-height:1;margin-bottom:6px;}
  .popup-temp .unit{font-size:13px;font-weight:500;opacity:.8;}
  .popup-row{font-size:12px;color:#7ec8e3;display:flex;justify-content:space-between;gap:14px;margin-top:3px;}
  .temp-marker{border-radius:50%;border:2.5px solid;display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:800;box-shadow:0 2px 8px rgba(0,0,0,.5);cursor:pointer;transition:transform .15s;line-height:1;}
  .temp-marker:hover{transform:scale(1.15);}
  .legend{position:absolute;top:10px;right:10px;bottom:auto;z-index:1000;background:rgba(13,30,54,.92);border:1px solid #1e3a5f;border-radius:8px;padding:11px 15px;font-size:12px;color:#b8d8e8;backdrop-filter:blur(4px);min-width:160px;}
  #panel-0 .legend{top:60px;right:10px;}
  .legend h4{font-size:11px;color:#6b8fa8;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;}
  .legend-row{display:flex;align-items:center;gap:8px;margin-bottom:5px;white-space:nowrap;}
  .legend-dot{width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,.4);flex-shrink:0;}
  .stat-bar{position:absolute;top:54px;left:10px;z-index:1000;background:rgba(13,30,54,.92);border:1px solid #1e3a5f;border-radius:8px;padding:10px 13px;font-size:12px;color:#b8d8e8;backdrop-filter:blur(4px);line-height:1.85;white-space:nowrap;}
  #panel-0 .stat-bar{top:102px;}

  /* ── 좌측 상단: 야간/백색/영상 지도 선택 버튼 ── */
  .basemap-btn-group{position:absolute;top:10px;left:10px;z-index:1300;display:flex;align-items:center;gap:4px;background:rgba(13,30,54,.92);border:1px solid #1e3a5f;border-radius:20px;padding:4px;backdrop-filter:blur(4px);box-shadow:0 3px 12px rgba(0,0,0,.35);}
  .basemap-btn{appearance:none;border:none;outline:none;cursor:pointer;font-size:11px;color:#b8d8e8;background:transparent;border-radius:16px;padding:6px 11px;white-space:nowrap;transition:background .2s,color .2s;font-family:inherit;}
  .basemap-btn:hover{color:#e8f4f8;}
  .basemap-btn.active{background:#2f6fed;color:#fff;font-weight:600;}
  .stat-bar .val{color:#f4a261;font-weight:700;}
  .stat-bar .grn{color:#4caf50;font-weight:700;}
  .stat-bar .org{color:#e07020;font-weight:700;}
  .stat-bar .red{color:#e63946;font-weight:700;}
  .stat-bar .lbl{color:#6b8fa8;font-size:11px;}
  .no-coord-box{position:absolute;bottom:22px;left:10px;z-index:1000;background:rgba(13,30,54,.9);border:1px solid #2a4a6f;border-radius:7px;padding:8px 12px;font-size:11px;color:#6b8fa8;max-width:360px;backdrop-filter:blur(4px);}
  .nc-label{color:#f4a261;font-weight:600;margin-right:4px;}
  .nc-item{display:inline-block;margin:2px 4px 2px 0;background:#1e3a5f;border-radius:3px;padding:1px 5px;color:#b8d8e8;}

  /* ── 금일 수온 탭: 우측 상단 지도 제어 및 양식장 전환 UI ── */
  .map-action-controls{position:absolute;top:10px;right:10px;z-index:1200;display:flex;align-items:center;gap:7px;}
  .water-info-toggle,.farm-toggle,.contour-toggle,.special-toggle{position:static;width:42px;height:42px;border:1px solid #2a4a70;border-radius:8px;background:rgba(13,30,54,.96);color:#7ec8e3;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 3px 12px rgba(0,0,0,.35);backdrop-filter:blur(4px);}
  .water-info-toggle:hover,.farm-toggle:hover,.contour-toggle:hover,.special-toggle:hover{border-color:#f4a261;color:#f4a261;}
  .water-info-toggle.active{background:#1e4b68;border-color:#7ec8e3;color:#e8f4f8;box-shadow:0 0 0 3px rgba(126,200,227,.18);}
  .farm-toggle.active{background:#f4a261;border-color:#ffd166;color:#0a1628;box-shadow:0 0 0 3px rgba(244,162,97,.22);}
  .contour-toggle.active{background:#2e86de;border-color:#7ec8e3;color:#fff;box-shadow:0 0 0 3px rgba(46,134,222,.25);}
  .special-toggle.active{background:#7a2f2f;border-color:#ff8f8f;color:#ffe3e3;box-shadow:0 0 0 3px rgba(255,0,0,.2);}
  .water-info-toggle svg,.farm-toggle svg,.contour-toggle svg,.special-toggle svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
  .special-marker{width:15px;height:15px;border-radius:50%;box-shadow:0 2px 8px rgba(0,0,0,.55);cursor:pointer;transition:transform .15s;}
  .special-marker:hover{transform:scale(1.2);}
  .special-legend-hint{position:absolute;bottom:22px;right:10px;z-index:1000;background:rgba(13,30,54,.92);border:1px solid #1e3a5f;border-radius:8px;padding:9px 12px;font-size:11px;color:#b8d8e8;backdrop-filter:blur(4px);display:none;}
  .special-legend-hint.show{display:block;}
  .special-legend-hint .legend-row{display:flex;align-items:center;gap:8px;margin-bottom:4px;white-space:nowrap;}
  .special-legend-hint .legend-row:last-child{margin-bottom:0;}
  .special-legend-hint .legend-dot{width:13px;height:13px;border-radius:50%;border:2px solid rgba(255,255,255,.4);flex-shrink:0;}
  .contour-msg{position:absolute;top:60px;right:10px;z-index:1300;background:rgba(13,30,54,.95);border:1px solid #2a4a70;border-radius:8px;padding:9px 13px;font-size:12px;color:#e8f4f8;max-width:230px;line-height:1.4;box-shadow:0 3px 12px rgba(0,0,0,.35);display:none;}
  .contour-traffic-badge{position:absolute;bottom:10px;left:10px;z-index:1300;background:rgba(13,30,54,.85);border:1px solid #2a4a70;border-radius:6px;padding:5px 10px;font-size:11px;color:#9fb8cc;box-shadow:0 2px 8px rgba(0,0,0,.3);display:none;}
  .contour-tip{background:#0d1e36!important;border:1px solid #2a4a70!important;color:#e8f4f8!important;font-size:11px!important;padding:2px 6px!important;box-shadow:none!important;}
  .contour-tip::before{display:none!important;}
  .depth-sounding-icon{background:transparent;border:none;}
  .depth-sounding-label{font-size:10px;font-weight:700;text-shadow:-1px 0 #06131f,0 1px #06131f,1px 0 #06131f,0 -1px #06131f,0 0 4px #06131f;white-space:nowrap;pointer-events:auto;cursor:default;user-select:none;}
  .farm-search{position:absolute;top:56px;left:10px;z-index:1200;display:none;width:min(360px,calc(100vw - 82px));padding:7px 8px;background:rgba(13,30,54,.96);border:1px solid #1e3a5f;border-radius:8px;color:#b8d8e8;box-shadow:0 3px 12px rgba(0,0,0,.35);backdrop-filter:blur(4px);}
  .farm-search.visible{display:block;}
  .farm-search-row{display:flex;gap:5px;}
  .farm-search-row input{flex:1;min-width:0;height:30px;padding:0 8px;border:1px solid #2a4a70;border-radius:5px;background:#091729;color:#e8f4f8;font-size:11px;outline:none;}
  .farm-search-row input:focus{border-color:#7ec8e3;}
  .farm-search-row input::placeholder{color:#6b8fa8;}
  .farm-search-row button{height:30px;padding:0 10px;border:1px solid #f4a261;border-radius:5px;background:#f4a261;color:#0a1628;font-size:11px;font-weight:700;cursor:pointer;}
  .farm-search-results{display:none;margin-top:7px;max-height:300px;overflow-y:auto;border-top:1px solid #1e3a5f;padding-top:6px;}
  .farm-search-results.show{display:block;}
  .farm-search-count{font-size:10px;color:#7ec8e3;margin-bottom:5px;}
  .farm-search-item{display:block;width:100%;text-align:left;padding:7px 8px;margin-bottom:4px;border:1px solid #1e3a5f;border-radius:6px;background:#0d1e36;color:#b8d8e8;cursor:pointer;}
  .farm-search-item:hover{background:#17304f;border-color:#7ec8e3;}
  .farm-search-item strong{display:block;color:#fff;font-size:12px;margin-bottom:2px;}
  .farm-search-item span{display:block;font-size:10px;color:#7ec8e3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .farm-search-empty{font-size:11px;color:#f4a261;padding:5px 2px;}
  .farm-gps{position:absolute;top:108px;left:10px;z-index:1200;display:none;width:40px;height:40px;border:1px solid #2a4a70;border-radius:50%;background:rgba(13,30,54,.96);color:#4a9fd8;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 3px 12px rgba(0,0,0,.35);backdrop-filter:blur(4px);}
  .farm-gps.visible{display:flex;}
  .farm-gps.active{background:#123259;border-color:#8fd6ff;color:#8fd6ff;box-shadow:0 0 0 4px rgba(74,159,216,.25),0 3px 12px rgba(0,0,0,.35);}
  .farm-gps svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  .farm-hidden{display:none !important;}
  .water-info-hidden{display:none !important;}
  .farm-popup .leaflet-popup-content-wrapper{background:#0d1e36;border:1px solid #1e3a5f;border-radius:8px;box-shadow:0 4px 20px rgba(0,0,0,.5);color:#e8f4f8;}
  .farm-popup .leaflet-popup-tip{background:#1e3a5f;}
  .farm-popup-card{padding:3px 1px;min-width:210px;}
  .farm-popup-tag{display:inline-block;padding:2px 7px;border-radius:4px;font-size:10px;font-weight:700;color:#fff;margin-bottom:6px;}
  .farm-popup-title{font-size:14px;font-weight:700;color:#fff;margin-bottom:6px;}
  .farm-popup-row{font-size:11px;color:#b8d8e8;line-height:1.45;margin-top:3px;}
  .farm-popup-row b{color:#7ec8e3;}
  @media (max-width:600px) {
    .map-action-controls{top:7px;right:7px;gap:6px;}
    .water-info-toggle,.farm-toggle,.contour-toggle,.special-toggle{width:39px;height:39px;}
    .water-info-toggle svg,.farm-toggle svg,.contour-toggle svg,.special-toggle svg{width:21px;height:21px;}
    .special-legend-hint{bottom:18px;right:7px;font-size:10.5px;padding:8px 10px;}
    .contour-msg{top:56px;right:7px;max-width:190px;font-size:11px;padding:7px 10px;}
    .stat-bar{top:50px;left:7px;}
    #panel-0 .stat-bar{top:96px;left:7px;font-size:11px;padding:8px 10px;line-height:1.7;}
    #panel-0 .legend{top:56px;right:7px;min-width:145px;padding:9px 11px;font-size:11px;}
    #panel-0 .legend h4{margin-bottom:6px;}
    #panel-0 .legend-row{gap:6px;margin-bottom:4px;}
    #panel-0 .legend-dot{width:14px;height:14px;}
    .farm-search{top:53px;left:7px;}
    .farm-gps{top:103px;left:7px;}
    .basemap-btn-group{top:7px;left:7px;gap:3px;padding:3px;}
    .basemap-btn{font-size:10px;padding:5px 8px;}
  }

  /* ── 3번 탭 (피해현황 및 특보 대시보드) 스타일 ── */
  .damage-panel{
    flex:1;
    position:relative;
    display:none;
    overflow-y:auto;
    overflow-x:hidden;
    padding:18px 20px;
    gap:18px;
    min-height:calc(100vh - 48px);
    grid-template-columns:1fr;
  }
  .damage-panel.active{display:grid;}
  @media (min-width: 980px) {
    .damage-panel{grid-template-columns: 1fr 1fr;}
  }

  /* 모든 박스의 공통 카드 규격 */
  .damage-box{
    background:#0d1e36;
    border:1px solid #1e3a5f;
    border-radius:10px;
    padding:16px 20px;
    display:flex;
    flex-direction:column;
    min-height:340px;
    box-shadow:0 4px 15px rgba(0,0,0,0.25);
  }
  .card-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:1px solid #1a3353;
    padding-bottom:10px;
    margin-bottom:12px;
    min-height:28px;
  }
  .card-header h3{font-size:14px;font-weight:700;color:#e8f4f8;display:flex;align-items:center;gap:8px;}
  .card-header h3::before{content:'';display:inline-block;width:4px;height:14px;background:#f4a261;border-radius:2px;}
  .badge-tag{font-size:11px;padding:3px 9px;background:#162e4a;border:1px solid #23476f;color:#7ec8e3;border-radius:4px;font-weight:500;}

  /* 1행 전용 카드 높이 */
  .top-card{
    min-height:540px;
    height:560px;
  }

  /* [1행 좌측] 해역도 사진 박스 */
  .map-box-inner{
    flex:1;
    background:#071220;
    border:1px solid #162e4a;
    border-radius:6px;
    padding:4px;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
  }
  .map-box-inner img{
    width:100%;
    height:100%;
    object-fit:contain;
    border-radius:4px;
    display:block;
  }

  /* [1행 우측] 위기경보 테이블 박스 */
  .table-box-inner{
    flex:1;
    background:#071220;
    border:1px solid #162e4a;
    border-radius:6px;
    padding:8px 12px;
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }
  .table-scroll{
    flex:1;
    display:flex;
    flex-direction:column;
    justify-content:flex-start;
    overflow-y:auto;
  }
  .table-scroll::-webkit-scrollbar{width:6px;}
  .table-scroll::-webkit-scrollbar-thumb{background:#1e3a5f;border-radius:3px;}

  .custom-table{
    width:100%;
    height:100%;
    border-collapse:collapse;
    font-size:13px;
    text-align:center;
  }
  .custom-table th{
    background:#0d1e36;
    color:#7ec8e3;
    padding:10px 6px;
    font-weight:700;
    font-size:12.5px;
    border-bottom:2px solid #1e3a5f;
    position:sticky;
    top:0;
    z-index:2;
    white-space:nowrap;
  }
  .custom-table td{
    padding:9.5px 6px;
    border-bottom:1px solid #14253b;
    color:#d8e8f2;
    vertical-align:middle;
  }
  .custom-table tr:hover{background:rgba(30,58,95,0.3);}

  /* 위기경보 뱃지 스타일 */
  .alert-badge{display:inline-block;padding:3px 10px;border-radius:4px;font-size:11px;font-weight:800;letter-spacing:0.5px;}
  .alert-관심{background:rgba(42,157,143,0.22);color:#52b788;border:1px solid #2a9d8f;}
  .alert-주의{background:rgba(230,184,0,0.22);color:#ffd166;border:1px solid #e6b800;}
  .alert-경계{background:rgba(224,112,32,0.22);color:#f4a261;border:1px solid #e07020;}
  .alert-심각1{background:rgba(230,57,70,0.25);color:#ff6b6b;border:1px solid #e63946;}
  .alert-해제{background:rgba(139,155,170,0.22);color:#c3ced8;border:1px solid #8b9baa;}

  /* 숫자 데이터 강조 색상 */
  .val-none{color:#6b8fa8;font-weight:500;}
  .val-pre{color:#52b788;font-weight:700;}
  .val-adv{color:#7ec8e3;font-weight:700;}
  .val-warn{color:#ff6b6b;font-weight:800;font-size:14px;}

  /* 현재 위기경보 상태 행 하이라이트 */
  .row-current{
    background:rgba(230,57,70,0.2) !important;
  }
  .row-current td{
    border-top:1px solid rgba(230,57,70,0.5);
    border-bottom:1px solid rgba(230,57,70,0.5);
    font-weight:800;
  }
  /* 해제 상태의 현재 행: 붉은색 대신 회색 */
  .row-current.row-lifted{background:rgba(139,155,170,0.2) !important;}
  .row-current.row-lifted td{border-top:1px solid rgba(139,155,170,0.5);border-bottom:1px solid rgba(139,155,170,0.5);}
  .row-current.row-lifted .tag-now{background:#8b9baa;color:#ffffff;}
  .tag-now{
    display:inline-block;
    font-size:9.5px;
    padding:1px 5px;
    border-radius:3px;
    background:#e63946;
    color:#ffffff;
    font-weight:800;
    margin-left:4px;
    vertical-align:middle;
  }

  /* 2~3행 차트 래퍼 */
  .damage-box .chart-wrap{position:relative;flex:1;min-height:260px;width:100%;}

  /* 지역별 피해 추이 팝업 패널 */
  .region-trend-overlay{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(4,10,20,0.6);
    z-index:500;
    align-items:center;
    justify-content:center;
    padding:20px;
  }
  .region-trend-overlay.active{display:flex;}
  .region-trend-modal{
    background:#0d1e36;
    border:1px solid #23476f;
    border-radius:12px;
    width:100%;
    max-width:820px;
    max-height:86vh;
    display:flex;
    flex-direction:column;
    box-shadow:0 12px 40px rgba(0,0,0,0.45);
  }
  .region-trend-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px 20px;
    border-bottom:1px solid #1a3353;
  }
  .region-trend-head h3{font-size:15px;font-weight:700;color:#e8f4f8;display:flex;align-items:center;gap:8px;margin:0;}
  .region-trend-head h3::before{content:'';display:inline-block;width:4px;height:14px;background:#f4a261;border-radius:2px;}
  .region-trend-close{
    background:#162e4a;
    border:1px solid #23476f;
    color:#b8d8e8;
    width:28px;height:28px;
    border-radius:6px;
    cursor:pointer;
    font-size:14px;
    line-height:1;
  }
  .region-trend-close:hover{background:#1e3a5f;color:#fff;}
  .region-trend-body{padding:16px 20px 20px;flex:1;min-height:0;display:flex;flex-direction:column;}
  .region-trend-body .chart-wrap{position:relative;flex:1;min-height:320px;width:100%;}
  .region-trend-hint{font-size:11.5px;color:#6b8fa8;margin-top:8px;text-align:center;}
  .region-trend-empty{color:#6b8fa8;font-size:13px;text-align:center;padding:40px 0;}
  #chartRegionSpecies2026{cursor:pointer;}

  /* 지도 타일 이음새(격자선) 제거: 타일 가장자리 반투명 픽셀이 겹칠 때 밝기를 합산해 틈을 메움 (Chrome/Edge/Safari) */
  img.leaflet-tile{mix-blend-mode:plus-lighter;}
  .leaflet-container{background:#0a1628;}

  /* ── 저수온/고수온 모드 전환 ── */
  .hdr-right{display:flex;align-items:center;gap:14px;}
  .temp-mode-toggle{display:flex;gap:3px;background:#071220;border:1px solid #1e3a5f;border-radius:16px;padding:3px;}
  .temp-mode-btn{appearance:none;border:none;outline:none;cursor:pointer;font-size:11.5px;font-weight:600;color:#6b8fa8;background:transparent;border-radius:13px;padding:5px 13px;white-space:nowrap;transition:background .15s,color .15s;}
  .temp-mode-btn:hover{color:#e8f4f8;}
  .temp-mode-btn[data-mode="low"].active{background:#1f5fd0;color:#fff;}
  .temp-mode-btn[data-mode="high"].active{background:#e0562a;color:#fff;}
  body.mode-low .hi-only{display:none !important;}
  body.mode-high .lo-only{display:none !important;}
  .stat-bar .lb1{color:#a9d8f7;font-weight:700;}
  .stat-bar .lb2{color:#4f9cf0;font-weight:700;}
  .stat-bar .lb3{color:#3d73e6;font-weight:700;}
  .stat-bar .lcnt{margin-left:auto;padding-left:14px;}
  .stat-bar .legend-row{margin-bottom:2px;}
  .empty-note{color:#6b8fa8;font-size:13px;text-align:center;}
  @media (max-width:700px) {
    header{flex-wrap:wrap;}
    .hdr-right{width:100%;justify-content:space-between;padding:4px 0;}
  }
  /* ── 모바일 최적화: 범례 박스 압축 + 탭하면 접기 ── */
  .sb-head{display:none;}
  @supports (height:100dvh) { body{height:100dvh;} }
  @media (max-width:600px) {
    .stat-bar .sb-head{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:10.5px;color:#6b8fa8;cursor:pointer;line-height:1.4;margin-bottom:3px;}
    #panel-0 .stat-bar,#panel-1 .stat-bar{font-size:10.5px;padding:5px 8px;line-height:1.4;top:50px;}
    #panel-0 .stat-bar{top:96px;}
    #panel-0 .stat-bar .legend-row,#panel-1 .stat-bar .legend-row{gap:5px;margin-bottom:1px;}
    #panel-0 .stat-bar .legend-dot,#panel-1 .stat-bar .legend-dot{width:9px;height:9px;border-width:1.5px;}
    .stat-bar .lcnt{padding-left:6px;}
    .stat-bar .lbl{font-size:10px;}
    .stat-bar.collapsed{padding:4px 8px;}
    .stat-bar.collapsed .legend-row,.stat-bar.collapsed .sb-info{display:none;}
    .stat-bar.collapsed .sb-head{margin-bottom:0;}
  }

  /* ── 기상청 부이 통합 마커/범례 ── */
  .buoy-legend{position:absolute;right:10px;bottom:12px;z-index:1100;display:flex;align-items:center;gap:8px;padding:8px 11px;background:rgba(13,30,54,.94);border:1px solid #f28c28;border-radius:8px;color:#e8f4f8;font-size:11px;box-shadow:0 3px 12px rgba(0,0,0,.35);backdrop-filter:blur(4px);white-space:nowrap;}
  .buoy-legend b{color:#ffad55;font-weight:800;}
  .buoy-legend small{font-size:10px;color:#9fb8cc;margin-left:2px;}
  .buoy-legend-dot{width:13px;height:13px;border-radius:50%;display:inline-block;flex:0 0 13px;background:#f28c28;border:2px solid #fff1df;box-shadow:0 1px 5px rgba(0,0,0,.45);}
  #panel-0 .special-legend-hint{bottom:58px;}
  @media(max-width:600px){.buoy-legend{right:7px;bottom:8px;padding:6px 8px;font-size:10px;gap:6px}.buoy-legend-dot{width:11px;height:11px;flex-basis:11px}#panel-0 .special-legend-hint{bottom:52px;right:7px;}}


  .owner-legend{position:absolute;right:10px;bottom:28px;z-index:1100;max-height:calc(100% - 120px);overflow:auto;padding:9px 12px;background:rgba(13,30,54,.94);border:1px solid #1e3a5f;border-radius:8px;color:#e8f4f8;font-size:11.5px;line-height:1.35;box-shadow:0 3px 12px rgba(0,0,0,.4);min-width:196px;}
  .owner-legend .ol-head{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:10.5px;color:#6b8fa8;cursor:pointer;margin-bottom:5px;}
  .owner-legend .ol-head b{color:#f4a261;font-size:11.5px;}
  .owner-legend.collapsed .ol-body{display:none;}
  .owner-legend.collapsed .ol-head{margin-bottom:0;}
  .owner-legend .ol-row{display:flex;align-items:center;gap:7px;padding:1.5px 0;white-space:nowrap;}
  .owner-legend .ol-row .cnt{margin-left:auto;padding-left:12px;color:#f4a261;font-weight:700;}
  .owner-legend .dot{width:11px;height:11px;border-radius:50%;flex:0 0 11px;box-sizing:border-box;}
  .owner-legend .ol-sep{height:1px;background:#1e3a5f;margin:6px 0 5px;}
  .owner-legend .ol-sub{font-size:10px;color:#6b8fa8;margin:2px 0 3px;}
  .img-panel{align-items:center;justify-content:center;padding:16px;overflow:auto;background:#0a1628;}
  .map-panel.img-panel.active{display:flex;}
  .img-card{background:#fff;border-radius:10px;padding:14px;box-shadow:0 4px 18px rgba(0,0,0,.45);max-width:min(1100px,100%);max-height:100%;display:flex;align-items:center;justify-content:center;}
  .img-card img{display:block;max-width:100%;max-height:calc(100vh - 48px - 32px - 28px);height:auto;width:auto;object-fit:contain;}
  @media(max-width:600px){.owner-legend{right:7px;bottom:22px;padding:6px 8px;font-size:10px;min-width:160px;max-height:calc(100% - 100px)}}
</style>

<script>
const maps = [null, null];

// ── 금일 수온 탭: 특이지점 레이어 ──
let specialLayerGroup = null;
let specialModeActive = false;
let baseLayerGroup0 = null;

function setSpecialMode(active) {
  const map = maps[0];
  if (!map || !specialLayerGroup) return;
  specialModeActive = active;
  document.getElementById('special-toggle')?.classList.toggle('active', active);
  document.getElementById('special-toggle')?.setAttribute('aria-pressed', String(active));
  document.getElementById('special-legend-hint')?.classList.toggle('show', active);
  if (active) {
    if (baseLayerGroup0 && map.hasLayer(baseLayerGroup0)) map.removeLayer(baseLayerGroup0);
    if (!map.hasLayer(specialLayerGroup)) specialLayerGroup.addTo(map);
    if (farmLegendControl && farmLegendControl.getContainer) {
      const c = farmLegendControl.getContainer();
      if (c) c.style.display = 'none';
    }
  } else {
    if (map.hasLayer(specialLayerGroup)) map.removeLayer(specialLayerGroup);
    if (baseLayerGroup0 && waterInfoVisible && !map.hasLayer(baseLayerGroup0)) baseLayerGroup0.addTo(map);
    if (farmLegendControl && farmLegendControl.getContainer) {
      const c = farmLegendControl.getContainer();
      if (c) c.style.display = '';
    }
  }
}

// ── 금일 수온 탭: 양식장 레이어 및 검색/GPS ──
const FARM_OFFSET = {lat:-0.0023963963963963965, lng:0.002600511929058334};
const FARM_CATEGORY_META = {
  fish: {label:'어류', color:'#2e86de'},
  shellfish: {label:'패류', color:'#e67e22'},
  seaweed: {label:'해조류', color:'#27ae60'},
  mixed: {label:'복합/기타', color:'#8e44ad'}
};
let farmModeActive = false;
let farmLayer = null;
let farmRenderer = null;
let farmLegendControl = null;
let farmGpsWatchId = null;
let farmGpsState = null;
let waterInfoVisible = true;

function farmEscape(value) {
  return String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}

function farmFormatDate(ymd) {
  if (!ymd || String(ymd).length !== 8) return ymd || '-';
  const s = String(ymd);
  return `${s.slice(0,4)}.${s.slice(4,6)}.${s.slice(6,8)}`;
}

function farmPopupHtml(properties) {
  const p = properties || {};
  const meta = FARM_CATEGORY_META[p.cat] || FARM_CATEGORY_META.mixed;
  return `<div class="farm-popup-card">
    <div class="farm-popup-tag" style="background:${meta.color}">${meta.label}</div>
    <div class="farm-popup-title">${farmEscape(p.lcns_no || '(면허번호 미상)')}</div>
    <div class="farm-popup-row"><b>양식물:</b> ${farmEscape(p.farm_knd || '-')}</div>
    <div class="farm-popup-row"><b>어업종류:</b> ${farmEscape(p.fids_knd || '-')}${p.fids_mthd ? ' / ' + farmEscape(p.fids_mthd) : ''}</div>
    <div class="farm-popup-row"><b>면적:</b> ${farmEscape(p.area ?? '-')} ha</div>
    <div class="farm-popup-row"><b>주소:</b> ${farmEscape(p.addr || '-')} (${farmEscape(p.sgg_nm || '-')})</div>
    <div class="farm-popup-row"><b>면허기간:</b> ${farmFormatDate(p.lcns_bgng)} ~ ${farmFormatDate(p.lcns_end)}</div>
  </div>`;
}

function ensureFarmLayer() {
  const map = maps[0];
  const farms = window.AQUACULTURE_FARMS_GEOJSON;
  if (!map || !farms || !Array.isArray(farms.features)) {
    window.alert('양식장 데이터를 불러오지 못했습니다. aquaculture_farms.js 파일이 수온 HTML과 같은 폴더에 있는지 확인해주세요.');
    return false;
  }
  if (farmLayer) return true;

  const pane = map.getPane('farm-pane') || map.createPane('farm-pane');
  pane.style.zIndex = '650';
  pane.style.pointerEvents = 'auto';
  const renderer = L.canvas({pane:'farm-pane', padding:0.3});
  farmRenderer = renderer;
  farmLayer = L.geoJSON(farms, {
    pane: 'farm-pane',
    renderer: renderer,
    coordsToLatLng: c => L.latLng(c[1] + FARM_OFFSET.lat, c[0] + FARM_OFFSET.lng),
    style: feature => {
      const meta = FARM_CATEGORY_META[(feature.properties || {}).cat] || FARM_CATEGORY_META.mixed;
      return {color:meta.color, weight:1.2, fillColor:meta.color, fillOpacity:0.42, renderer:renderer};
    },
    onEachFeature: (feature, layer) => {
      layer.bindPopup(farmPopupHtml(feature.properties), {className:'farm-popup', maxWidth:290});
      layer.on('mouseover', () => layer.setStyle({weight:3, fillOpacity:0.72}));
      layer.on('mouseout', () => farmLayer && farmLayer.resetStyle(layer));
    }
  }).addTo(map);
  return true;
}

function clearFarmLayer() {
  const map = maps[0];
  if (farmLayer && map) map.removeLayer(farmLayer);
  if (farmRenderer && map) map.removeLayer(farmRenderer);
  const pane = map?.getPane('farm-pane');
  if (pane) {
    pane.replaceChildren();
    pane.style.pointerEvents = 'none';
  }
  farmLayer = null;
  farmRenderer = null;
}

function closeFarmSearch() {
  const results = document.getElementById('farm-search-results');
  if (results) { results.innerHTML = ''; results.classList.remove('show'); }
}

function selectFarmFeature(feature) {
  if (!farmLayer || !maps[0]) return;
  let targetLayer = null;
  farmLayer.eachLayer(layer => { if (layer.feature === feature) targetLayer = layer; });
  if (!targetLayer) return;
  const bounds = targetLayer.getBounds();
  if (bounds.isValid()) maps[0].fitBounds(bounds, {maxZoom:14, padding:[28,28]});
  targetLayer.bringToFront();
  window.setTimeout(() => targetLayer.openPopup(), 250);
}

function searchFarms() {
  const input = document.getElementById('farm-search-input');
  const results = document.getElementById('farm-search-results');
  const farms = window.AQUACULTURE_FARMS_GEOJSON;
  if (!input || !results || !farms) return;
  const query = input.value.trim().toLowerCase().replace(/\s+/g, '');
  closeFarmSearch();
  if (!query) return;
  const matches = farms.features.filter(feature => {
    const no = String((feature.properties || {}).lcns_no || '').trim().toLowerCase().replace(/\s+/g, '');
    return no.includes(query);
  });
  results.classList.add('show');
  if (!matches.length) {
    results.innerHTML = '<div class="farm-search-empty">해당 양식번호를 찾을 수 없습니다.</div>';
    return;
  }
  const shown = matches.slice(0, 50);
  const note = matches.length > shown.length ? ` · 처음 ${shown.length}건 표시` : '';
  results.innerHTML = `<div class="farm-search-count">검색결과 ${matches.length}건${note}</div>` + shown.map((feature, index) => {
    const p = feature.properties || {};
    return `<button class="farm-search-item" type="button" data-farm-index="${index}"><strong>${farmEscape(p.lcns_no || '(면허번호 미상)')}</strong><span>${farmEscape(p.farm_knd || '-')} · ${farmEscape(p.addr || p.sgg_nm || '-')}</span></button>`;
  }).join('');
  results.querySelectorAll('.farm-search-item').forEach(item => {
    item.addEventListener('click', () => { selectFarmFeature(shown[Number(item.dataset.farmIndex)]); closeFarmSearch(); });
  });
}

function stopFarmGps() {
  if (farmGpsWatchId !== null) navigator.geolocation.clearWatch(farmGpsWatchId);
  farmGpsWatchId = null;
  if (farmGpsState && maps[0]) {
    maps[0].removeLayer(farmGpsState.marker);
    maps[0].removeLayer(farmGpsState.circle);

}

function toggleFarmGps() {
  const map = maps[0];
  const button = document.getElementById('farm-gps');
  if (!map || !button) return;
  if (farmGpsWatchId !== null) { stopFarmGps(); return; }
  if (!navigator.geolocation) { window.alert('이 브라우저에서는 위치 정보 기능을 지원하지 않습니다.'); return; }
  if (location.protocol !== 'https:' && location.hostname !== 'localhost') { window.alert('위치 정보는 보안 연결(https)에서만 사용할 수 있습니다.'); return; }
  const pane = map.getPane('farm-gps-pane') || map.createPane('farm-gps-pane');
  pane.style.zIndex = '675';
  button.classList.add('active');
  farmGpsWatchId = navigator.geolocation.watchPosition(
    position => {
      const {latitude, longitude, accuracy} = position.coords;
      if (!farmGpsState) {
        const marker = L.circleMarker([latitude, longitude], {radius:8, weight:3, color:'#fff', fillColor:'#4a9fd8', fillOpacity:1, pane:'farm-gps-pane'}).addTo(map);
        const circle = L.circle([latitude, longitude], {radius:accuracy, color:'#4a9fd8', weight:1, fillColor:'#4a9fd8', fillOpacity:0.14, pane:'farm-gps-pane'}).addTo(map);
        farmGpsState = {marker, circle};
        map.setView([latitude, longitude], Math.max(map.getZoom(), 14));
      } else {
        farmGpsState.marker.setLatLng([latitude, longitude]);
        farmGpsState.circle.setLatLng([latitude, longitude]).setRadius(accuracy);
      }
    },
    () => { window.alert('현재 위치를 가져올 수 없습니다. 브라우저의 위치 권한을 확인해주세요.'); stopFarmGps(); },

}

// ── 등심선(수심 컨투어) 레이어 ──
// 공공데이터포털: 해양수산부 국립해양조사원_자연과학용 수심정보 조회
// 참고: 이 API는 브라우저(클라이언트)에서 직접 호출합니다. CORS를 허용하지 않는 API라면
//       "수심 API 호출에 실패했습니다" 메시지가 뜨며, 이 경우 서버 프록시가 필요합니다.
const CONTOUR_CFG = {
  endpoint: 'https://apis.data.go.kr/1192136/waterDepth/GetWaterDepthApiService',
  serviceKey: 'cWn1z1ggbFkIDR7Qv9J%2BPWO%2BX1Te5bavHH36QbpzU%2B0Min5AW8EAWMCmKa79wyzoMeaiSYUqloa7zDPqq7aTLQ%3D%3D',
  numOfRows: 300,
  tilesPerSide: 5,  // 화면을 5x5 타일로 나눠 각 타일에서 병렬 수집 (전역 위도 정렬 데이터의 편향 방지)
  maxPoints: 6000,  // 서버에서 받아올 최대 지점 수
  maxLabels: 550,   // 실제로 화면에 숫자로 표시할 최대 개수 (가독성을 위한 상한)
  labelMinPx: 30,    // 숫자 라벨 간 최소 픽셀 간격 (겹침 방지)
  minZoom: 10,       // 이 줌 미만이면 지도를 더 확대하라고 안내
  moveDebounceMs: 700,    // 지도 이동 후 갱신까지 대기 시간
  minRefreshGapMs: 0,     // 직전 갱신 후 최소 대기 시간 (0 = 제한 없음, 기존 방식)
  dailyQuota: 10000       // 참고용: 공공데이터포털에 명시된 일일 트래픽 한도 (자동 조회 불가, 수동 입력값)
};
// 응답 필드명이 문서와 다를 경우 이 배열에 실제 필드명을 추가하면 됩니다.
// (브라우저 콘솔에 "[등심선] 원본 응답 샘플" 로그로 실제 필드명을 확인할 수 있습니다)
const CONTOUR_FIELD_CANDIDATES = {
  lat: ['lat', 'la', 'y', 'ycrd', 'LAT', 'Y'],
  lon: ['lot', 'lon', 'lo', 'x', 'xcrd', 'LOT', 'LON', 'X'],
  depth: ['dpwt', 'depth', 'dpth', 'val', 'value', 'waterDepth', 'DEPTH', 'VAL', 'DPWT']
};
let contourActive = false;
let contourLayerGroup = null;
let contourFetchToken = 0;
let contourMoveTimer = null;

function contourPick(obj, candidates) {
  for (const key of candidates) {
    if (obj[key] !== undefined && obj[key] !== null && obj[key] !== '') return obj[key];
  }
  return undefined;
}

// ── 로컬 API 호출량 카운터 ──
// 공공데이터포털은 API 응답으로 잔여 트래픽을 알려주지 않습니다(마이페이지에서만 확인 가능).
// 대신 이 브라우저에서 이 페이지로 호출한 횟수를 매일 자정 기준으로 직접 세어 "추정치"로 보여줍니다.
// 다른 브라우저/기기/계정에서 같은 키를 함께 쓰면 실제 값과 어긋날 수 있습니다.
function contourTrafficDateKey() {
  const d = new Date();
  return 'contourApiCalls_' + d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function contourTrafficGet() {
  try {
    return parseInt(localStorage.getItem(contourTrafficDateKey()), 10) || 0;
  } catch (e) { return 0; }
}
function contourTrafficAdd(n) {
  try {
    const key = contourTrafficDateKey();
    const next = contourTrafficGet() + n;
    localStorage.setItem(key, String(next));
    return next;
  } catch (e) { return null; }
}
function contourUpdateTrafficBadge() {
  let badge = document.getElementById('contour-traffic-badge');
  if (!badge) {
    badge = document.createElement('div');
    badge.id = 'contour-traffic-badge';
    badge.className = 'contour-traffic-badge';
    document.getElementById('panel-0').appendChild(badge);
  }
  const used = contourTrafficGet();
  const quota = CONTOUR_CFG.dailyQuota;
  const remain = Math.max(0, quota - used);
  badge.textContent = `오늘 수심 API 사용(추정): ${used.toLocaleString()} / ${quota.toLocaleString()} · 남음 ${remain.toLocaleString()}`;
  badge.style.display = contourActive ? 'block' : 'none';
}

function contourShowMessage(msg, isError) {
  let box = document.getElementById('contour-msg');
  if (!box) {
    box = document.createElement('div');
    box.id = 'contour-msg';
    box.className = 'contour-msg';
    document.getElementById('panel-0').appendChild(box);
  }
  box.style.borderColor = isError ? '#e63946' : '#2a4a70';
  box.style.color = isError ? '#ffb3ba' : '#e8f4f8';
  box.textContent = msg;
  box.style.display = 'block';
  clearTimeout(box._t);
  box._t = setTimeout(() => { box.style.display = 'none'; }, isError ? 6000 : 2600);
}

async function contourFetchTile(t, tileIdx) {
  const url = `${CONTOUR_CFG.endpoint}?serviceKey=${CONTOUR_CFG.serviceKey}&type=json&ymin=${t.ymin}&ymax=${t.ymax}&xmin=${t.xmin}&xmax=${t.xmax}&pageNo=1&numOfRows=${CONTOUR_CFG.numOfRows}`;
  let res;
  try {
    res = await fetch(url);
  } catch (e) {
    throw new Error('NETWORK');
  }
  if (!res.ok) throw new Error('HTTP_' + res.status);
  const data = await res.json();
  if (tileIdx === 0) console.log('[등심선] 원본 응답 샘플(필드명 확인용):', data);
  const body = (data && data.response && data.response.body) || data.body || data;
  let items = (body && body.items && (body.items.item || body.items)) || (body && body.item) || [];
  if (!Array.isArray(items)) items = items ? [items] : [];
  return items;
}

async function contourFetchPoints(bounds) {
  // 데이터가 위도순 정렬이라 단순 페이지네이션은 화면 남쪽 끝의 얇은 띠만 반환합니다.
  // 화면을 여러 타일로 나눠 각 타일에서 병렬로 1페이지씩 가져와 고르게 분포된 샘플을 확보합니다.
  const n = CONTOUR_CFG.tilesPerSide;
  const south = bounds.getSouth(), north = bounds.getNorth();
  const west = bounds.getWest(), east = bounds.getEast();
  const dLat = (north - south) / n;
  const dLon = (east - west) / n;
  const tiles = [];
  for (let ty = 0; ty < n; ty++) {
    for (let tx = 0; tx < n; tx++) {
      tiles.push({
        ymin: (south + ty * dLat).toFixed(4),
        ymax: (south + (ty + 1) * dLat).toFixed(4),
        xmin: (west + tx * dLon).toFixed(4),
        xmax: (west + (tx + 1) * dLon).toFixed(4)
      });
    }
  }
  contourTrafficAdd(tiles.length);
  const results = await Promise.allSettled(tiles.map((t, idx) => contourFetchTile(t, idx)));
  const points = [];
  let httpAuthErr = false, networkErr = false, otherErrMsg = '';
  for (const r of results) {
    if (r.status === 'fulfilled') {
      for (const it of r.value) {
        const lat = parseFloat(contourPick(it, CONTOUR_FIELD_CANDIDATES.lat));
        const lon = parseFloat(contourPick(it, CONTOUR_FIELD_CANDIDATES.lon));
        const depth = parseFloat(contourPick(it, CONTOUR_FIELD_CANDIDATES.depth));
        if (Number.isFinite(lat) && Number.isFinite(lon) && Number.isFinite(depth)) {
          points.push({ lat, lon, depth });
        }
      }
    } else {
      const msg = String(r.reason && r.reason.message || '');
      if (msg === 'HTTP_401' || msg === 'HTTP_403') httpAuthErr = true;
      else if (msg === 'NETWORK') networkErr = true;
      else otherErrMsg = msg;
    }
  }
  if (!points.length) {
    if (httpAuthErr) throw new Error('HTTP_401');
    if (networkErr) throw new Error('NETWORK');
    if (otherErrMsg) throw new Error(otherErrMsg);
  }
  return points;
}

function contourSubsample(points, maxN) {
  if (points.length <= maxN) return points;
  const step = points.length / maxN;
  const out = [];
  for (let i = 0; i < maxN; i++) out.push(points[Math.floor(i * step)]);
  return out;
}

function contourDeclutter(map, points, minPx, maxN) {
  const kept = [];
  const keptPx = [];
  for (let i = 0; i < points.length && kept.length < maxN; i++) {
    const p = points[i];
    const px = map.latLngToContainerPoint([p.lat, p.lon]);
    let ok = true;
    for (let k = 0; k < keptPx.length; k++) {
      const dx = keptPx[k].x - px.x, dy = keptPx[k].y - px.y;
      if (dx * dx + dy * dy < minPx * minPx) { ok = false; break; }
    }
    if (ok) { kept.push(p); keptPx.push(px); }
  }
  return kept;
}

function contourColorForDepth(depth, min, max) {
  const palette = ['#bfe6ff', '#8fd0f2', '#5fb3e0', '#3d93cc', '#2a72ad', '#1c5488', '#123c66'];
  if (!(max > min)) return palette[0];
  const t = Math.min(1, Math.max(0, (depth - min) / (max - min)));
  return palette[Math.round(t * (palette.length - 1))];
}

function contourClearLayer() {
  const map = maps[0];
  if (contourLayerGroup && map) map.removeLayer(contourLayerGroup);
  contourLayerGroup = null;
  if (map) map.off('moveend', contourOnMoveEnd);
  const box = document.getElementById('contour-msg');
  if (box) box.style.display = 'none';
  const badge = document.getElementById('contour-traffic-badge');
  if (badge) badge.style.display = 'none';
}

function contourOnMoveEnd() {
  if (!contourActive) return;
  clearTimeout(contourMoveTimer);
  contourMoveTimer = setTimeout(() => { contourRefresh(); }, CONTOUR_CFG.moveDebounceMs);
}

async function contourRefresh() {
  const map = maps[0];
  if (!map) return;
  if (map.getZoom() < CONTOUR_CFG.minZoom) {
    contourShowMessage('수심 숫자를 표시하려면 지도를 더 확대해주세요 (줌 ' + CONTOUR_CFG.minZoom + ' 이상).', true);
    contourClearLayer();
    return;
  }
  const myToken = ++contourFetchToken;
  contourShowMessage('수심 데이터를 불러오는 중...', false);
  let points;
  try {
    points = await contourFetchPoints(map.getBounds());
  } catch (e) {
    if (myToken !== contourFetchToken) return;
    contourUpdateTrafficBadge();
    const msg = String(e && e.message || '');
    if (msg === 'HTTP_401' || msg === 'HTTP_403') {
      contourShowMessage('API 인증키 오류입니다 (' + msg + '). 공공데이터포털 활용신청 상태를 확인해주세요.', true);
    } else if (msg === 'NETWORK') {
      contourShowMessage('수심 API 호출에 실패했습니다. 브라우저가 apis.data.go.kr 요청을 CORS로 차단했을 수 있습니다. (콘솔 확인)', true);
    } else {
      contourShowMessage('수심 데이터를 불러오지 못했습니다 (' + msg + ').', true);
    }
    console.error('[수심] fetch 오류:', e);
    return;
  }
  if (myToken !== contourFetchToken || !contourActive) return;
  if (!points.length) {
    contourShowMessage('현재 영역에 수심 데이터가 없습니다.', true);
    contourClearLayer();
    return;
  }
  points = contourSubsample(points, CONTOUR_CFG.maxPoints);
  const shown = contourDeclutter(map, points, CONTOUR_CFG.labelMinPx, CONTOUR_CFG.maxLabels);
  if (myToken !== contourFetchToken || !contourActive) return;
  if (contourLayerGroup) map.removeLayer(contourLayerGroup);
  if (!shown.length) {
    contourShowMessage('표시할 수심 지점이 없습니다.', true);
    contourLayerGroup = null;
    return;
  }
  let min = Infinity, max = -Infinity;
  for (const p of shown) { if (p.depth < min) min = p.depth; if (p.depth > max) max = p.depth; }
  contourLayerGroup = L.layerGroup();
  shown.forEach(p => {
    const color = contourColorForDepth(p.depth, min, max);
    const labelText = p.depth >= 100 ? Math.round(p.depth).toString() : p.depth.toFixed(1);
    const icon = L.divIcon({
      className: 'depth-sounding-icon',
      html: `<span class="depth-sounding-label" style="color:${color}">${labelText}</span>`,
      iconSize: [0, 0],
      iconAnchor: [0, 0]
    });
    const marker = L.marker([p.lat, p.lon], { icon, interactive: true, keyboard: false });
    marker.bindTooltip(`수심 ${p.depth.toFixed(2)}m<br>${p.lat.toFixed(5)}, ${p.lon.toFixed(5)}`, { sticky: true, className: 'contour-tip' });
    marker.addTo(contourLayerGroup);
  });
  contourLayerGroup.addTo(map);
  contourUpdateTrafficBadge();
  contourShowMessage(`수심 숫자 표시 완료 (${shown.length}개 지점, ${Math.round(min)}~${Math.round(max)}m)`, false);
}

async function setContourMode(active) {
  const map = maps[0];
  if (!map) return;
  contourActive = active;
  document.getElementById('contour-toggle')?.classList.toggle('active', active);
  document.getElementById('contour-toggle')?.setAttribute('aria-pressed', String(active));
  if (!active) {
    contourClearLayer();
    return;
  }
  map.off('moveend', contourOnMoveEnd);
  map.on('moveend', contourOnMoveEnd);
  contourUpdateTrafficBadge();
  await contourRefresh();
}

// ── 배경지도(야간/백색/영상) 선택 ──
// 야간지도: 브이월드(V-World) 야간지도(midnight)
// 백색지도: 브이월드(V-World) 백지도 — 한글 지명/지형 표기
// 영상지도: 브이월드(V-World) 위성영상
const VWORLD_API_KEY = '157B3208-B2B2-3F62-91D0-A3C82B0ACF1F';
const BASEMAP_MODES = ['night', 'white', 'satellite'];
const baseTileLayers = [null, null];   // [{night, white, satellite}, {night, white, satellite}]
const basemapMode = ['night', 'night'];

function buildBaseLayers() {
  const night = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', {attribution:'Tiles &copy; Esri &mdash; Esri, DeLorme, NAVTEQ | ', maxZoom:16});
  const white = L.tileLayer(`https://api.vworld.kr/req/wmts/1.0.0/${VWORLD_API_KEY}/white/{z}/{y}/{x}.png`, {attribution:'&copy; VWorld (국토교통부 국토정보플랫폼)', maxZoom:19, minZoom:6});
  const satellite = L.tileLayer(`https://api.vworld.kr/req/wmts/1.0.0/${VWORLD_API_KEY}/Satellite/{z}/{y}/{x}.jpeg`, {attribution:'&copy; VWorld (국토교통부 국토정보플랫폼) 위성영상', maxZoom:19, minZoom:6});
  return {night, white, satellite};
}

function updateBasemapButtons(idx) {
  const wrap = document.getElementById('basemap-btns-' + idx);
  if (!wrap) return;
  wrap.querySelectorAll('.basemap-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.mode === basemapMode[idx]);
  });
}

function setBasemap(idx, mode) {
  const map = maps[idx];
  const layers = baseTileLayers[idx];
  if (!map || !layers || !BASEMAP_MODES.includes(mode)) return;
  if (VWORLD_API_KEY.includes('여기에')) {
    window.alert('배경지도를 사용하려면 스크립트 상단의 VWORLD_API_KEY 값을 브이월드(vworld.kr)에서 발급받은 키로 교체해주세요.');
    return;
  }
  if (basemapMode[idx] === mode) return;
  BASEMAP_MODES.forEach(m => {
    if (m !== mode && map.hasLayer(layers[m])) map.removeLayer(layers[m]);
  });
  if (!map.hasLayer(layers[mode])) layers[mode].addTo(map);
  basemapMode[idx] = mode;
  updateBasemapButtons(idx);
}

// ── 저수온/고수온 모드 (기본: 저수온) ──
let tempMode = 'low';
const tempGroups = [null, null];   // [{high, low}, {high, low}] 탭별 마커 레이어

function toggleSb(head) {
  const box = head.parentElement;
  const collapsed = box.classList.toggle('collapsed');
  const caret = head.querySelector('.sb-caret');
  if (caret) caret.textContent = collapsed ? '▸' : '▾';
}

function setTempMode(mode) {
  if (mode !== 'low' && mode !== 'high') return;
  tempMode = mode;
  document.body.classList.toggle('mode-low', mode === 'low');
  document.body.classList.toggle('mode-high', mode === 'high');
  document.querySelectorAll('.temp-mode-btn').forEach(b => b.classList.toggle('active', b.dataset.mode === mode));
  if (mode === 'low' && specialModeActive) setSpecialMode(false);   // 특이지점은 고수온 전용
  for (let i = 0; i < 2; i++) {
    const m = maps[i], g = tempGroups[i];
    if (!m || !g) continue;
    ['high', 'low'].forEach(k => { if (m.hasLayer(g[k])) m.removeLayer(g[k]); });
    if (i === 1 || (waterInfoVisible && !specialModeActive)) g[mode].addTo(m);
  }
  if (tempGroups[0]) baseLayerGroup0 = tempGroups[0][mode];
  // 숨겨져 있던 차트가 다시 보일 때 크기 재계산
  setTimeout(() => { try { Object.values(Chart.instances).forEach(c => c.resize()); } catch (e) {} }, 60);
}

const LINK_LABEL = {1:'연계 (공개)', 2:'연계 (외부 미표출)', 0:'수과원 미연계'};
function escHtml(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

function addStations(map) {
  const paneName = 'stationPane';
  if (!map.getPane(paneName)) { const p = map.createPane(paneName); p.style.zIndex = '660'; }   // 양식장(650)보다 위, 내 위치(675)·팝업(700)보다 아래
  const tp = map.getPane('tooltipPane'); if (tp) tp.style.zIndex = '690';
  const group = L.layerGroup();
  STATIONS.forEach(p => {
    const fill = OWNER_COLORS[p.o] || '#9e9e9e';
    const R = 5;
    const opt = { pane: paneName, radius: R, fillColor: fill, fillOpacity: 1, stroke: false };
    if (p.l === 0) {            // 수과원 미연계 → 붉은 실선 테두리
      Object.assign(opt, { stroke: true, color: '#c40000', weight: 2.5, opacity: 1 });
    } else if (p.l === 2) {     // 연계(외부 미표출) → 붉은 점선 (원둘레를 8등분: 대시 4개·간격 4개, 끝은 butt)
      const seg = (2 * Math.PI * R) / 8;
      Object.assign(opt, { stroke: true, color: '#c40000', weight: 2.5, opacity: 1, lineCap: 'butt', dashArray: seg + ' ' + seg });
    }
    const mk = L.circleMarker([p.lat, p.lon], opt);
    const idRow = p.id ? `<div class="popup-row"><span>${p.t ? '지점번호' : '관측소 코드'}</span><span>${escHtml(p.id)}</span></div>` : '';
    const noteRow = p.nt ? `<div class="popup-row"><span>비고</span><span>${escHtml(p.nt)}</span></div>` : '';
    const typeRow = p.t ? `<div class="popup-row"><span>관측망 구분</span><span>${escHtml(p.t)}</span></div>` : '';
    mk.bindTooltip(escHtml(p.n) + ' · ' + escHtml(p.o), {direction:'top', offset:[0,-7], opacity:0.95, className:'contour-tip'});
    mk.bindPopup(
      `<div class="popup-inner"><div class="popup-rank" style="color:${fill}">${escHtml(p.o)}</div><div class="popup-name">${escHtml(p.n)}</div><div class="popup-sea">${escHtml(p.sea)}</div>`
      + `<div class="popup-row"><span>수과원 연계</span><span>${LINK_LABEL[p.l]}</span></div>${typeRow}${idRow}${noteRow}`
      + `<div class="popup-row"><span>위도</span><span>${p.lat.toFixed(5)}°</span></div><div class="popup-row"><span>경도</span><span>${p.lon.toFixed(5)}°</span></div></div>`,
      {className:'custom-popup', maxWidth:230});
    mk.addTo(group);
  });
  group.addTo(map);
}

function initMap(idx) {
  const m = L.map('map'+idx, {center:[34.9,127.5], zoom:8, zoomControl:false});
  const baseLayers = buildBaseLayers();
  baseTileLayers[idx] = baseLayers;
  baseLayers[basemapMode[idx]].addTo(m);
  updateBasemapButtons(idx);
  maps[idx] = m;
  addStations(m);
  initFarmTools(m);   // 양식장 표시·검색, 수심, 내 위치 (aquaculture_farms.js 연계)
}
initMap(0);

function switchTab(i) {
  document.querySelectorAll('.tab-btn').forEach((b, k) => b.classList.toggle('active', k === i));
  document.querySelectorAll('.map-panel').forEach((p, k) => p.classList.toggle('active', k === i));
  const meta = document.getElementById('hdr-meta'); if (meta) meta.style.visibility = (i === 0 ? 'visible' : 'hidden');
  if (i === 0 && maps[0]) setTimeout(() => maps[0].invalidateSize(), 50);
}
